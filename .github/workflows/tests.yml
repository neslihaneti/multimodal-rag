name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    # Unit tests with stub models + hybrid search against a real pgvector. The models do not fit a CI runner:
    # the end-to-end tests and the evaluation run on the Mac and their reports are committed under reports/.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      host: localhost
      port: "5432"
      usr_name: postgres
      usr_password: postgres
      TEST_DATABASE_NAME: rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest
